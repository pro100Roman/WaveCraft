name: CI

on:
  push:
  pull_request:

jobs:
  python-client:
    name: Python client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python client
        env:
          PYTHONPATH: python/src
        run: python -m unittest discover -s python/tests -v

  msrv:
    name: Rust 1.79
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.79.0

      - name: Install Linux window-system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwayland-dev libxkbcommon-dev libxcb-render0-dev
          libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - run: cargo check --workspace --locked

  workspace:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-15
            artifact: wavecraft-macos-universal
            archive: wavecraft-macos-universal.zip
            macos_deployment_target: "11.0"
          - name: Linux
            os: ubuntu-22.04
            artifact: wavecraft-linux-x86_64
            archive: wavecraft-linux-x86_64.tar.gz
          - name: Windows
            os: windows-2022
            artifact: wavecraft-windows-x86_64
            archive: wavecraft-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux window-system dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwayland-dev libxkbcommon-dev libxcb-render0-dev
          libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Build release binaries
        if: runner.os == 'Linux'
        run: cargo build --workspace --release --locked

      - name: Build universal macOS release binaries
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        shell: bash
        run: |
          cargo build --workspace --release --locked \
            --target aarch64-apple-darwin
          cargo build --workspace --release --locked \
            --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/wavecraft-cli \
            target/x86_64-apple-darwin/release/wavecraft-cli \
            -output target/release/wavecraft-cli

      - name: Build Windows release binaries with static MSVC runtime
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --workspace --release --locked

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: bash scripts/package-macos.sh --universal

      - name: Verify macOS release architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_executable=target/release/bundle/osx/WaveCraft.app/Contents/MacOS/WaveCraft
          lipo target/release/wavecraft-cli -verify_arch arm64
          lipo target/release/wavecraft-cli -verify_arch x86_64
          lipo "$app_executable" -verify_arch arm64
          lipo "$app_executable" -verify_arch x86_64

      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package_directory="dist/${{ matrix.artifact }}"
          mkdir -p "$package_directory"
          cp -R target/release/bundle/osx/WaveCraft.app "$package_directory/"
          cp target/release/wavecraft-cli README.md "$package_directory/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$package_directory" "dist/${{ matrix.archive }}"

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/wavecraft-linux-x86_64/resources
          install -m 755 target/release/wavecraft-gui \
            target/release/wavecraft-cli dist/wavecraft-linux-x86_64/
          cp -R resources/fpga dist/wavecraft-linux-x86_64/resources/
          cp README.md dist/wavecraft-linux-x86_64/
          tar -C dist -czf dist/wavecraft-linux-x86_64.tar.gz \
            wavecraft-linux-x86_64

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = "dist/wavecraft-windows-x86_64"
          New-Item -ItemType Directory -Force "$packageDirectory/resources" | Out-Null
          Copy-Item -Path target/release/wavecraft-gui.exe -Destination $packageDirectory
          Copy-Item -Path target/release/wavecraft-cli.exe -Destination $packageDirectory
          Copy-Item -Path README.md -Destination $packageDirectory
          Copy-Item -Path resources/fpga -Destination "$packageDirectory/resources/" -Recurse
          Compress-Archive -Path $packageDirectory -DestinationPath dist/wavecraft-windows-x86_64.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [msrv, workspace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: wavecraft-*
          path: dist
          merge-multiple: true

      - name: Generate release notes from commit messages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${RELEASE_TAG}"
          else
            commit_range="$RELEASE_TAG"
          fi

          {
            if [[ -n "$previous_tag" ]]; then
              printf '## Changes since `%s`\n\n' "$previous_tag"
            else
              printf '## Changes\n\n'
            fi

            while IFS=$'\t' read -r commit subject; do
              printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' \
                "$subject" "${commit:0:7}" "$REPOSITORY" "$commit"
            done < <(git log --no-merges --format='%H%x09%s' "$commit_range")

            if [[ -n "$previous_tag" ]]; then
              printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
                "$REPOSITORY" "$previous_tag" "$RELEASE_TAG"
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
