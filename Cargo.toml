[workspace]
members = [
    "apps/dsview-cli",
    "apps/dsview-gui",
    "crates/dsview-core",
    "crates/dsview-recording",
    "crates/dsview-sim",
    "crates/dsview-usb",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.79"

[profile.release]
debug = 1
lto = "thin"
