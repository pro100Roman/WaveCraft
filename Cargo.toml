[workspace]
members = [
    "apps/wavecraft-cli",
    "apps/wavecraft-gui",
    "crates/wavecraft-automation",
    "crates/wavecraft-core",
    "crates/wavecraft-recording",
    "crates/wavecraft-sim",
    "crates/wavecraft-usb",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.79"

[profile.release]
debug = 1
lto = "thin"
