[workspace]
members = [
    "apps/wavecraft-cli",
    "apps/wavecraft-gui",
    "crates/wavecraft-automation",
    "crates/wavecraft-core",
    "crates/wavecraft-decode",
    "crates/wavecraft-debug-probe",
    "crates/wavecraft-dsp",
    "crates/wavecraft-hackrf",
    "crates/wavecraft-recording",
    "crates/wavecraft-radio",
    "crates/wavecraft-sdr",
    "crates/wavecraft-sim",
    "crates/wavecraft-systemview",
    "crates/wavecraft-trace",
    "crates/wavecraft-usb",
]
exclude = ["crates/wavecraft-probe-rs"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.79"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Library crates must not panic on device or file input (see AGENTS.md). Return
# an error instead; test code is exempt through clippy.toml.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = 1
lto = "thin"
