[package]
name = "wavecraft-gui"
version = "0.6.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wavecraft-core = { path = "../../crates/wavecraft-core" }
wavecraft-decode = { path = "../../crates/wavecraft-decode" }
wavecraft-dsp = { path = "../../crates/wavecraft-dsp" }
wavecraft-hackrf = { path = "../../crates/wavecraft-hackrf" }
wavecraft-recording = { path = "../../crates/wavecraft-recording" }
wavecraft-sdr = { path = "../../crates/wavecraft-sdr" }
wavecraft-usb = { path = "../../crates/wavecraft-usb" }
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
rfd = "=0.15.0"
