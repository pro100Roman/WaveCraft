[package]
name = "wavecraft-probe-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
# probe-rs 0.32 requires Rust 1.95. Keeping that requirement in this adapter
# prevents it from leaking into the provider-neutral interface crate.
rust-version = "1.95"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
libloading = "0.8.9"
probe-rs = { git = "https://github.com/pro100Roman/probe-rs.git", rev = "e3ec82551c192be71b3be6c1387c7e147ba243d4", default-features = false, features = ["builtin-targets"] }
serde_json = "1.0.154"
wavecraft-debug-probe = { path = "../wavecraft-debug-probe" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading"] }
