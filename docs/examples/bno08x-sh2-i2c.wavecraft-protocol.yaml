# SH-2 over SHTP for the CEVA/Hillcrest BNO08x family, captured over I2C.
# Reference: SH-2 Reference Manual 1000-3625 and BNO080 Datasheet 1000-3927.
#
# WaveCraft protocol/v1 limitations:
# - one decoded message is emitted per I2C transaction, so only the first SH-2
#   sensor report following a Base Timestamp (0xFB) or Timestamp Rebase (0xFA)
#   is decoded;
# - SHTP cargo split across several I2C transactions is reassembled before
#   SH-2 message selection;
# - fixed-point sensor values are converted to physical units while the decoder
#   retains the original signed integer value.

schema: wavecraft.protocol/v1

protocol:
  id: ceva.bno08x.sh2-i2c
  name: BNO08x SH-2
  version: 1
  description: Common SH-2 control and sensor reports inside SHTP over I2C

input:
  transport: i2c
  stream: data

framing:
  strategy: segmented_transport_transaction
  header_bytes: 4
  length:
    offset: 0
    width: 2
    endian: little
    mask: 0x7FFF
  continuation:
    offset: 1
    mask: 0x80
    value: 0x80
  channel_offset: 2
  sequence_offset: 3
  max_frame_bytes: 32767

messages:
  - id: product_id_request
    name: Product ID request
    match:
      - offset: 1
        mask: 0x80
        value: 0
      - offset: 4
        value: 0xF9
    fields:
      - name: packet_length
        type: u16le
        mask: 0x7FFF
        bits:
          continuation: 15
        hidden: true
      - name: channel
        type: u8
        enum:
          0: shtp_command
          1: executable
          2: sh2_control
          3: input_normal
          4: input_wakeup
          5: gyro_rotation_vector
      - name: shtp_sequence
        type: u8
      - name: report_id
        type: u8
        expect: 0xF9
        hidden: true
      - name: reserved
        type: u8
        expect: 0
        hidden: true
    summary: "SH-2 Product ID request · SHTP seq {shtp_sequence}"

  - id: product_id_response
    name: Product ID response
    match:
      - offset: 1
        mask: 0x80
        value: 0
      - offset: 4
        value: 0xF8
    fields:
      - name: packet_length
        type: u16le
        mask: 0x7FFF
        hidden: true
      - name: channel
        type: u8
        enum:
          0: shtp_command
          1: executable
          2: sh2_control
          3: input_normal
          4: input_wakeup
          5: gyro_rotation_vector
      - name: shtp_sequence
        type: u8
      - name: report_id
        type: u8
        expect: 0xF8
        hidden: true
      - name: reset_cause
        type: u8
        enum:
          0: not_applicable
          1: power_on_reset
          2: internal_system_reset
          3: watchdog_timeout
          4: external_reset
          5: other
      - name: version_major
        type: u8
      - name: version_minor
        type: u8
      - name: part_number
        type: u32le
      - name: build_number
        type: u32le
      - name: version_patch
        type: u16le
      - name: reserved
        type: u16le
        expect: 0
        hidden: true
    summary: "BNO08x product {part_number} · firmware {version_major}.{version_minor}.{version_patch} · build {build_number} · reset {reset_cause}"

  - id: get_feature_request
    name: Get Feature request
    match:
      - offset: 1
        mask: 0x80
        value: 0
      - offset: 4
        value: 0xFE
    fields:
      - name: packet_length
        type: u16le
        mask: 0x7FFF
        hidden: true
      - name: channel
        type: u8
        enum:
          0: shtp_command
          1: executable
          2: sh2_control
          3: input_normal
          4: input_wakeup
          5: gyro_rotation_vector
      - name: shtp_sequence
        type: u8
      - name: report_id
        type: u8
        expect: 0xFE
        hidden: true
      - name: feature_report
        type: u8
        enum:
          0x01: accelerometer
          0x02: gyroscope_calibrated
          0x03: magnetic_field_calibrated
          0x04: linear_acceleration
          0x05: rotation_vector
          0x06: gravity
          0x07: gyroscope_uncalibrated
          0x08: game_rotation_vector
          0x09: geomagnetic_rotation_vector
          0x0A: pressure
          0x0B: ambient_light
          0x0C: humidity
          0x0D: proximity
          0x0E: temperature
          0x0F: magnetic_field_uncalibrated
          0x10: tap_detector
          0x11: step_counter
          0x12: significant_motion
          0x13: stability_classifier
          0x14: raw_accelerometer
          0x15: raw_gyroscope
          0x16: raw_magnetometer
          0x18: step_detector
          0x28: arvr_stabilized_rotation_vector
          0x29: arvr_stabilized_game_rotation_vector
          0x2A: gyro_integrated_rotation_vector
    summary: "SH-2 Get Feature request · sensor {feature_report} · SHTP seq {shtp_sequence}"

  - id: set_feature_command
    name: Set Feature command
    match:
      - offset: 1
        mask: 0x80
        value: 0
      - offset: 4
        value: 0xFD
    fields:
      - name: packet_length
        type: u16le
        mask: 0x7FFF
        hidden: true
      - name: channel
        type: u8
        enum:
          0: shtp_command
          1: executable
          2: sh2_control
          3: input_normal
          4: input_wakeup
          5: gyro_rotation_vector
      - name: shtp_sequence
        type: u8
      - name: report_id
        type: u8
        expect: 0xFD
        hidden: true
      - name: feature_report
        type: u8
        enum:
          0x01: accelerometer
          0x02: gyroscope_calibrated
          0x03: magnetic_field_calibrated
          0x04: linear_acceleration
          0x05: rotation_vector
          0x06: gravity
          0x07: gyroscope_uncalibrated
          0x08: game_rotation_vector
          0x09: geomagnetic_rotation_vector
          0x0A: pressure
          0x0B: ambient_light
          0x0C: humidity
          0x0D: proximity
          0x0E: temperature
          0x0F: magnetic_field_uncalibrated
          0x10: tap_detector
          0x11: step_counter
          0x12: significant_motion
          0x13: stability_classifier
          0x14: raw_accelerometer
          0x15: raw_gyroscope
          0x16: raw_magnetometer
          0x18: step_detector
          0x28: arvr_stabilized_rotation_vector
          0x29: arvr_stabilized_game_rotation_vector
          0x2A: gyro_integrated_rotation_vector
      - name: feature_flags
        type: u8
        bits:
          change_sensitivity_relative: 0
          change_sensitivity_enabled: 1
          wake_up_enabled: 2
          always_on_enabled: 3
      - name: change_sensitivity
        type: s16le
      - name: report_interval
        type: u32le
        display:
          unit: µs
      - name: batch_interval
        type: u32le
        display:
          unit: µs
      - name: sensor_specific
        type: u32le
    summary: "SH-2 Set Feature · sensor {feature_report} · report every {report_interval} · batch {batch_interval}"

  - id: get_feature_response
    name: Get Feature response
    match:
      - offset: 1
        mask: 0x80
        value: 0
      - offset: 4
        value: 0xFC
    fields:
      - name: packet_length
        type: u16le
        mask: 0x7FFF
        hidden: true
      - name: channel
        type: u8
        enum:
          0: shtp_command
          1: executable
          2: sh2_control
          3: input_normal
          4: input_wakeup
