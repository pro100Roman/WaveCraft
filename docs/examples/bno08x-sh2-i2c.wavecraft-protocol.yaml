        display:
          unit: ADC counts
      - name: reserved
        type: u16le
        hidden: true
      - name: sensor_timestamp
        type: u32le
        display:
          unit: us
    summary: "Raw accelerometer (sensor-dependent ADC readings) · X {raw_acceleration_x} · Y {raw_acceleration_y} · Z {raw_acceleration_z} · sensor timestamp {sensor_timestamp} · accuracy {accuracy}"

