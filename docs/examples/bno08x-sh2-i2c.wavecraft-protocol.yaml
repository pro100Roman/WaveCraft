      - name: sensor_specific
        type: u32le
    summary: "SH-2 Feature configuration · sensor {feature_report} · report every {report_interval} · batch {batch_interval}"

  - id: accelerometer
    name: Accelerometer
    match:
      - offset: 1
        mask: 0x80
        value: 0
      - offset: 4
        mask: 0xFE
        value: 0xFA
      - offset: 9
        value: 0x01
    fields:
      - name: packet_length
        type: u16le
        mask: 0x7FFF
      - name: channel
        type: u8
        enum:
          3: input_normal
          4: input_wakeup
      - name: shtp_sequence
        type: u8
      - name: timestamp_reference
        type: u8
        enum:
          0xFA: timestamp rebase
          0xFB: base timestamp
        hidden: true
      - name: timestamp_delta
        type: s32le
        display:
          unit: signed 100 us ticks
      - name: report_type
        type: u8
        expect: 0x01
        enum:
          0x01: accelerometer (acceleration including gravity)
      - name: sensor_sequence
        type: u8
      - name: accuracy
        type: u8
        mask: 0x03
        enum:
          0: unreliable
          1: low
          2: medium
          3: high
      - name: delay_low_8_bits
        type: u8
        display:
          unit: 100 us ticks
      - name: acceleration_x
        type: s16le
        display:
          unit: m/s^2
          fixed_point_q: 8
      - name: acceleration_y
        type: s16le
        display:
          unit: m/s^2
          fixed_point_q: 8
      - name: acceleration_z
        type: s16le
        display:
          unit: m/s^2
          fixed_point_q: 8
    summary: "Accelerometer (includes gravity) · X {acceleration_x} · Y {acceleration_y} · Z {acceleration_z} · accuracy {accuracy}"

