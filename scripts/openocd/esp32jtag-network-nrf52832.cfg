# ESP32JTAG CMSIS-DAP over TCP configuration for an nRF52832 target.
#
# Usage:
#   openocd -f scripts/openocd/esp32jtag-network-nrf52832.cfg
#
# Optional overrides:
#   ESP32JTAG_HOST=192.168.1.50 \
#   ESP32JTAG_PORT=4441 \
#   ESP32JTAG_SPEED_KHZ=6000 \
#     openocd -f scripts/openocd/esp32jtag-network-nrf52832.cfg
#
# OpenOCD options set before this file take precedence too:
#   openocd -c "set ESP32JTAG_HOST 192.168.1.50" \
#           -c "set ESP32JTAG_SPEED_KHZ 1000" \
#           -f scripts/openocd/esp32jtag-network-nrf52832.cfg

if {![info exists ESP32JTAG_HOST]} {
	if {[info exists ::env(ESP32JTAG_HOST)]} {
		set ESP32JTAG_HOST $::env(ESP32JTAG_HOST)
	} else {
		set ESP32JTAG_HOST 192.168.4.1
	}
}

if {![info exists ESP32JTAG_PORT]} {
	if {[info exists ::env(ESP32JTAG_PORT)]} {
		set ESP32JTAG_PORT $::env(ESP32JTAG_PORT)
	} else {
		set ESP32JTAG_PORT 4441
	}
}

if {![info exists ESP32JTAG_SPEED_KHZ]} {
	if {[info exists ::env(ESP32JTAG_SPEED_KHZ)]} {
		set ESP32JTAG_SPEED_KHZ $::env(ESP32JTAG_SPEED_KHZ)
	} else {
		set ESP32JTAG_SPEED_KHZ 6000
	}
}

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host $ESP32JTAG_HOST
cmsis-dap tcp port $ESP32JTAG_PORT

# The nRF52 target file selects SWD, configures the Cortex-M4 target, and uses
# SYSRESETREQ for reset. ESP32JTAG's physical SRESET output is currently
# available through its web API, not through the CMSIS-DAP nRESET command.
source [find target/nordic/nrf52.cfg]

# target/nordic/nrf52.cfg defaults to 1 MHz; apply the requested value after
# sourcing it so this setting wins.
adapter speed $ESP32JTAG_SPEED_KHZ

echo "ESP32JTAG CMSIS-DAP TCP: $ESP32JTAG_HOST:$ESP32JTAG_PORT, SWD ${ESP32JTAG_SPEED_KHZ} kHz"
